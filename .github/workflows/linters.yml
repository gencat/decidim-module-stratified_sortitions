name: "[CI] Lint / Lint code"

on:
  push:
    branches:
      - master
      - release/*
      - "*-stable"
  pull_request:

env:
  RUBY_VERSION: 3.3.4

jobs:
  test-report:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cbc
        shell: "bash"
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc coinor-libcbc-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop -P
